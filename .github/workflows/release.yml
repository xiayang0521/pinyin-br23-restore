# ============================================================================
# BR23 拼音机固件工具 —— Windows 安装包构建与 Release 发布
#
# 触发：推送 v* tag（如 v1.1.0）。也可在 Actions 页面手动 dispatch。
# 流程：单测冒烟 → PyInstaller(onedir) → Inno Setup 编译安装包 →
#       附带便携版 zip → 创建 GitHub Release 并上传资产。
# ============================================================================
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pyyaml crcmod pytest

      - name: Run unit tests
        run: python -m pytest tests/unit -q

      - name: Compute version (strip leading v from tag)
        shell: bash
        run: echo "VER=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build with PyInstaller (onedir)
        run: python -m PyInstaller "BR23固件工具.spec" --noconfirm

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile installer (Inno Setup)
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\BR23_setup.iss ^
            /DAppVer=%VER% ^
            /DSourceRoot=${{ github.workspace }} ^
            /DOutDir=${{ github.workspace }}\installer\output

      - name: Rename installer to release asset name
        shell: bash
        run: |
          mv "installer/output/Setup-BR23固件工具-$VER.exe" \
             "installer/output/Setup-BR23-Firmware-Tool-$VER.exe"

      - name: Package portable zip
        shell: bash
        run: tar -a -c -f "BR23-Firmware-Tool-v$VER-portable.zip" -C dist "BR23固件工具"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "installer/output/Setup-BR23-Firmware-Tool-$VER.exe" \
            "BR23-Firmware-Tool-v$VER-portable.zip" \
            --title "BR23 拼音机固件工具 $GITHUB_REF_NAME" \
            --generate-notes
