# ============================================================================
# BR23 拼音机固件工具 —— Windows 安装包构建与 Release 发布
#
# 触发：
#   * 推送 v* tag（推荐，正常开发流程）
#   * 定时轮询（兜底：最新 tag 尚未发布 Release 时自动构建发布）
#   * Actions 页面手动 Run workflow
# 流程：解析最新 v* tag → 单测冒烟 → PyInstaller(onedir) →
#       Inno Setup 编译安装包 → 附带便携版 zip → 创建 GitHub Release。
# ============================================================================
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve latest v* tag
        shell: bash
        run: |
          TAG=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -z "$TAG" ]; then
            echo "No v* tag found, nothing to release."
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VER=${TAG#v}" >> "$GITHUB_ENV"
          echo "Resolved tag: $TAG (version ${TAG#v})"

      - name: Check out release tag
        run: git checkout "$env:TAG"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pyyaml crcmod pytest

      - name: Run unit tests
        run: python -m pytest tests/unit -q

      - name: Build with PyInstaller (onedir)
        run: python -m PyInstaller "BR23固件工具.spec" --noconfirm

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile installer (Inno Setup)
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\BR23_setup.iss ^
            /DAppVer=%VER% ^
            /DSourceRoot=${{ github.workspace }} ^
            /DOutDir=${{ github.workspace }}\installer\output

      - name: Rename installer to release asset name
        shell: bash
        run: |
          mv "installer/output/Setup-BR23固件工具-$VER.exe" \
             "installer/output/Setup-BR23-Firmware-Tool-$VER.exe"

      - name: Package portable zip
        shell: bash
        run: tar -a -c -f "BR23-Firmware-Tool-v$VER-portable.zip" -C dist "BR23固件工具"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, nothing to do."
            exit 0
          fi
          gh release create "$TAG" \
            "installer/output/Setup-BR23-Firmware-Tool-$VER.exe" \
            "BR23-Firmware-Tool-v$VER-portable.zip" \
            --title "BR23 拼音机固件工具 $TAG" \
            --generate-notes
